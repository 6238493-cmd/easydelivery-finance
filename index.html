<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Easy Delivery Finance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Reset & Base ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       var(--tg-theme-bg-color,           #111827);
  --bg2:      var(--tg-theme-secondary-bg-color, #1f2937);
  --text:     var(--tg-theme-text-color,         #f9fafb);
  --hint:     var(--tg-theme-hint-color,         #9ca3af);
  --link:     var(--tg-theme-link-color,         #60a5fa);
  --btn:      var(--tg-theme-button-color,       #3b82f6);
  --btn-text: var(--tg-theme-button-text-color,  #ffffff);
  --green: #34d399;
  --red:   #f87171;
  --blue:  #60a5fa;
  --amber: #fbbf24;
  --border: rgba(255,255,255,.08);
  --radius: 14px;
  --radius-sm: 8px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 72px;
  -webkit-font-smoothing: antialiased;
}

/* ── Bottom Nav ────────────────────────────────────────── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  background: none; border: none; color: var(--hint);
  font-size: 10px; font-weight: 500; cursor: pointer;
  transition: color .15s; padding: 6px 0;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active { color: var(--btn); }

/* ── Pages ─────────────────────────────────────────────── */
.page { display: none; padding: 16px; animation: fadeIn .18s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

/* ── Cards ─────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--hint); margin-bottom: 12px;
}

/* ── Stat grid ─────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.stat {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}
.stat .val { font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat .lbl { font-size: 11px; color: var(--hint); margin-top: 3px; }

/* ── Colors ────────────────────────────────────────────── */
.c-green { color: var(--green); }
.c-red   { color: var(--red);   }
.c-blue  { color: var(--blue);  }
.c-amber { color: var(--amber); }
.c-hint  { color: var(--hint);  }

/* ── Chart ─────────────────────────────────────────────── */
.chart-wrap { height: 190px; position: relative; }

/* ── Section title ─────────────────────────────────────── */
h2 {
  font-size: 15px; font-weight: 700;
  margin: 20px 0 10px;
  display: flex; align-items: center; gap: 6px;
}
h2:first-child { margin-top: 0; }

/* ── Deal grid (2 колонки, вертикальный скролл) ────────── */
.deals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deals-section-title {
  grid-column: 1 / -1;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--hint);
  margin-top: 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.deal-card {
  background: rgba(255,255,255,.05);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-bottom: 8px;
  border-left: 3px solid transparent;
}
.deal-card.cargo  { border-color: var(--blue); }
.deal-card.air    { border-color: var(--amber); }
.deal-card.closed { border-color: var(--green); opacity: .65; }
.deal-id   { font-size: 11px; color: var(--hint); }
.deal-name { font-weight: 600; font-size: 13px; margin: 2px 0 4px; }
.deal-status { font-size: 10px; color: var(--hint); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-bar { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; background: var(--green); }
.deal-nums {
  display: flex; justify-content: space-between;
  font-size: 11px; margin-top: 5px;
}

/* ── Settlements ────────────────────────────────────────── */
.party-card {
  background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.party-head { display: flex; justify-content: space-between; align-items: center; }
.party-name { font-weight: 700; font-size: 15px; }
.party-amounts { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; }
.debt-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 12px; }
.debt-meta { color: var(--hint); font-size: 11px; margin-top: 1px; }

/* ── Personal transactions ──────────────────────────────── */
.tx-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.tx-row:last-child { border-bottom: none; }
.tx-cat  { font-weight: 500; }
.tx-date { font-size: 11px; color: var(--hint); margin-top: 1px; }
.tx-amt  { font-weight: 700; white-space: nowrap; }

/* ── Badge ──────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px;
}
.badge-green { background: rgba(52,211,153,.15); color: var(--green); }
.badge-red   { background: rgba(248,113,113,.15); color: var(--red);   }
.badge-blue  { background: rgba(96,165,250,.15);  color: var(--blue);  }

/* ── Button ─────────────────────────────────────────────── */
.btn {
  display: block; width: 100%; padding: 12px;
  background: var(--btn); color: var(--btn-text);
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.btn:active { opacity: .8; }
.btn-sm { display: inline-block; width: auto; padding: 6px 12px; font-size: 12px; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--btn);
  color: var(--btn);
}

/* ── Loader / Error ─────────────────────────────────────── */
.center { text-align: center; padding: 48px 16px; }
.center svg { width: 40px; height: 40px; margin-bottom: 12px; }
.center p { color: var(--hint); margin-top: 6px; font-size: 13px; }

/* ── Divider ────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ── История транзакций ─────────────────────────────────── */
.history-row {
  background: var(--bg2); border-radius: var(--radius-sm);
  padding: 10px 12px; margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 10px;
}
.history-dir { font-size: 17px; flex-shrink: 0; margin-top: 1px; font-weight: 700; }
.history-main { flex: 1; min-width: 0; }
.history-amt  { font-weight: 700; font-size: 14px; }
.history-meta { font-size: 11px; color: var(--hint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; color: var(--hint); }
.icon-btn:active { background: var(--border); }

/* ── Edit modal ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-end; z-index: 500;
}
.modal-box {
  background: var(--bg2); border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 16px 32px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title { font-weight: 700; font-size: 16px; margin-bottom: 16px; }
.form-row { margin-bottom: 12px; }
.form-label { font-size: 11px; color: var(--hint); margin-bottom: 5px; }
.form-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
  color: var(--text); font-size: 14px; outline: none;
}
.form-input:focus { border-color: var(--btn); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.dir-toggle { display: flex; gap: 8px; }
.dir-btn {
  flex: 1; padding: 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: none;
  color: var(--hint); font-size: 13px; font-weight: 600; cursor: pointer;
}
.dir-btn.active-in  { background: rgba(52,211,153,.15); border-color: var(--green); color: var(--green); }
.dir-btn.active-out { background: rgba(248,113,113,.15); border-color: var(--red);   color: var(--red);   }
.modal-btns { display: flex; gap: 10px; margin-top: 16px; }

/* ── Общий баланс (full-width) ──────────────────────────── */
.stat-total {
  background: linear-gradient(135deg, rgba(52,211,153,.15), rgba(59,130,246,.1));
  border: 1px solid rgba(52,211,153,.25);
  border-radius: var(--radius); padding: 16px 12px;
  text-align: center; margin-bottom: 10px;
}
.stat-total .val { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat-total .lbl { font-size: 12px; color: var(--hint); margin-top: 3px; }

/* ── Счета (Bybit / MP) ─────────────────────────────────── */
.accounts-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.account-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.account-card.bybit { border-left: 3px solid #f7a600; }
.account-card.mp    { border-left: 3px solid #00b1ea; }
.account-card .val  { font-size: 18px; font-weight: 700; line-height: 1.1; }
.account-card .lbl  { font-size: 11px; color: var(--hint); margin-top: 3px; }
.account-card .upd  { font-size: 10px; color: var(--hint); margin-top: 2px; opacity: .6; }

/* ── Фильтры истории ────────────────────────────────────── */
.filter-row {
  display: flex; gap: 6px; margin-bottom: 14px;
  overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--hint); border-radius: 20px;
  padding: 5px 13px; font-size: 12px; font-weight: 500;
  transition: all .15s;
}
.filter-btn.active { background: var(--btn); border-color: var(--btn); color: #fff; }

/* ── Группировка по дате в истории ─────────────────────── */
.date-header {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--hint);
  padding: 14px 0 6px; display: flex;
  justify-content: space-between; align-items: center;
}
.date-header:first-child { padding-top: 2px; }
.date-day-total { font-size: 11px; font-weight: 600; }

/* ── Дашборд плитки (Главная) ───────────────────────────── */
.dash-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 10px;
}
.dash-wide { grid-column: 1 / -1; }
.dash-card {
  background: var(--bg2); border-radius: var(--radius);
  padding: 14px 12px; text-align: center;
}
.dash-card .val { font-size: 20px; font-weight: 700; line-height: 1.15; }
.dash-card .lbl { font-size: 11px; color: var(--hint); margin-top: 3px; }
.dash-card .sub { font-size: 11px; color: var(--hint); margin-top: 6px; display: flex; justify-content: center; gap: 10px; }
.dash-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--hint); margin: 16px 0 8px; }

/* ── Mic button ─────────────────────────────────────────── */
.mic-btn {
  position: fixed; bottom: 80px; right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--btn); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.3);
  z-index: 100; transition: transform .15s, background .2s;
}
.mic-btn:active { transform: scale(.93); }
.mic-btn.recording { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)} 50%{box-shadow:0 0 0 10px rgba(248,113,113,0)} }
.mic-toast {
  position: fixed; bottom: 145px; right: 16px; left: 16px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  font-size: 13px; z-index: 101; display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

/* ── Deal detail modal ──────────────────────────────────── */
#dealDetailContainer .modal-overlay { z-index: 200; }
.deal-section-block {
  background: rgba(255,255,255,.04); border-radius: 10px;
  padding: 12px; margin-bottom: 10px;
}
.deal-section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--hint); margin-bottom: 8px;
}
.deal-section-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; margin-bottom: 4px;
}
.deal-section-row:last-child { margin-bottom: 0; }
.deal-profit-block {
  background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.2);
  border-radius: 10px; padding: 12px; margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.deal-profit-col { text-align: center; }
.deal-profit-col .lbl { font-size: 11px; color: var(--hint); margin-bottom: 3px; }
.deal-profit-col .val { font-size: 20px; font-weight: 700; line-height: 1.1; }
.progress-bar-red .progress-fill { background: var(--red); }

/* ── Scroll fixes ───────────────────────────────────────── */
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- Deal Detail Container -->
<div id="dealDetailContainer"></div>

<!-- Mic button -->
<button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Голосовой ввод">🎤</button>
<div class="mic-toast" id="micToast"></div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEdit()">
  <div class="modal-box">
    <div class="modal-title">✏️ Редактировать</div>
    <div class="form-row">
      <div class="form-label">Направление</div>
      <div class="dir-toggle">
        <button class="dir-btn" id="btnIn"  onclick="setEditDir('Приход')">↗ Приход</button>
        <button class="dir-btn" id="btnOut" onclick="setEditDir('Расход')">↙ Расход</button>
      </div>
    </div>
    <div class="form-row-2">
      <div>
        <div class="form-label">Сумма</div>
        <input class="form-input" id="editAmount" type="number" step="0.01">
      </div>
      <div>
        <div class="form-label">Валюта</div>
        <input class="form-input" id="editCurrency" type="text" style="text-transform:uppercase">
      </div>
    </div>
    <div class="form-row">
      <div class="form-label">Категория</div>
      <input class="form-input" id="editCategory" type="text">
    </div>
    <div class="form-row">
      <div class="form-label">Контрагент</div>
      <input class="form-input" id="editCounterparty" type="text">
    </div>
    <div class="form-row">
      <div class="form-label">Описание</div>
      <input class="form-input" id="editDescription" type="text">
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeEdit()">Отмена</button>
      <button class="btn" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<nav class="nav" id="nav">
  <button class="nav-btn active" data-tab="summary" onclick="switchTab('summary')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
    Главная
  </button>
  <button class="nav-btn" data-tab="deals" onclick="switchTab('deals')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 7H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1.1 2-.9 2-2V9c0-1.1-.9-2-2-2zm-1 11H5c-.55 0-1-.45-1-1v-7h16v7c0 .55-.45 1-1 1zM4 5h16v2H4z"/></svg>
    Сделки
  </button>
  <button class="nav-btn" data-tab="history" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    История
  </button>
  <button class="nav-btn" data-tab="settlements" onclick="switchTab('settlements')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    Долги
  </button>
</nav>

<!-- Pages -->
<div id="summary"     class="page active"><div class="center"><div class="loader"></div><p>Загрузка…</p></div></div>
<div id="deals"       class="page"><div class="center"><p class="c-hint">Загрузка…</p></div></div>
<div id="history"     class="page"><div class="center"><p class="c-hint">Загрузка…</p></div></div>
<div id="settlements" class="page"><div class="center"><p class="c-hint">Загрузка…</p></div></div>

<script>
// ─── Config ──────────────────────────────────────────────
const API_URL = 'https://easyfin-bot.duckdns.org/miniapp';

// ─── Telegram WebApp ─────────────────────────────────────
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ─── State ───────────────────────────────────────────────
let D = null; // appData
let charts = {};

// ─── Tab switching ────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
}

// ─── Format helpers ───────────────────────────────────────
function fmtUsd(n, dec) {
  if (n == null) return '$0';
  const abs = Math.abs(n);
  const s   = dec != null
    ? abs.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })
    : abs >= 1000
      ? Math.round(abs).toLocaleString('en-US')
      : abs.toFixed(abs < 10 ? 2 : 0);
  return (n < 0 ? '-$' : '$') + s;
}
function fmtSign(n) {
  if (!n) return '$0';
  return (n > 0 ? '+' : '') + fmtUsd(n);
}
function fmtDate(d) { return d ? String(d).substring(0, 10) : ''; }
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Fetch data ───────────────────────────────────────────
async function loadData() {
  const initData = tg ? tg.initData : '';
  const url = `${API_URL}?action=data&initData=${encodeURIComponent(initData)}`;
  try {
    const res = await fetch(url, { cache: 'no-store', credentials: 'omit', redirect: 'follow' });
    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (_) {
      // Показываем первые 200 символов ответа для отладки
      throw new Error('Ответ не JSON: ' + text.substring(0, 200));
    }
    if (json.error) throw new Error(json.error);
    D = json;
    renderAll();
  } catch (e) {
    showError(e.message || String(e));
  }
}

function showError(msg) {
  const el = `
    <div class="center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="c-red">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h3>Ошибка загрузки</h3>

const DEAL_GROUPS = [
  { title: '🔄 В работе',    prefixes: ['В работе', 'в работе', 'Оплачен'] },
  { title: '📦 Склад Китай', prefixes: ['1.','2.','3.','4.'] },
  { title: '✈️ В пути',      prefixes: ['5.','6.'] },
  { title: '🏭 Склад БА',    prefixes: ['7.','8.'] },
  { title: '✅ Закрыто',     prefixes: ['9.', 'ЗАКРЫТА', 'Закрыта'] },
];

function renderDeals() {
  const deals = D.deals || [];

  if (!deals.length) {
    document.getElementById('deals').innerHTML = '<div class="center"><p class="c-hint">Сделок пока нет</p></div>';
    return;
  }

  let html = '<div class="deals-grid">';

  DEAL_GROUPS.forEach(({ title, prefixes }) => {
    const group = deals.filter(d => prefixes.some(p => String(d.status).startsWith(p)));
    if (!group.length) return;

    html += `<div class="deals-section-title"><span>${title}</span><span class="badge badge-blue">${group.length}</span></div>`;

    group.forEach(d => {
      const isClosed    = String(d.status).includes('ЗАКРЫТ') || String(d.status).startsWith('9.');
      const typeClass   = isClosed ? 'closed' : d.type === 'Авиа' ? 'air' : 'cargo';
      const typeIcon    = d.type === 'Авиа' ? '✈️' : d.type === 'Карго' ? '📦' : '📋';
      const pct         = d.expected > 0 ? Math.min(100, Math.round(d.received / d.expected * 100)) : 0;
      const profitCls   = d.profit >= 0 ? 'c-green' : 'c-red';
      const shortStatus = String(d.status).replace(/^\d+\.\s*/, '');
      const subtitle    = d.type && d.type !== 'Карго' && d.type !== 'Авиа' ? escHtml(d.type) : '';

      const clientOwes = Math.max(0, (d.expected||0) - (d.received||0));

      html += `
        <div class="deal-card ${typeClass}" onclick="openDealDetail('${escHtml(d.id)}')" style="cursor:pointer">
          <div class="deal-id">${typeIcon} ${escHtml(d.id)}</div>
          <div class="deal-name">${escHtml(d.client)}${subtitle ? ' <span class="c-hint">· '+subtitle+'</span>' : ''}</div>
          <div class="deal-status">${escHtml(shortStatus)}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="deal-nums">
            <span class="c-hint">${fmtUsd(d.received)}/${fmtUsd(d.expected)}</span>
            <span class="${profitCls}">${d.profit ? fmtSign(d.profit) : ''}</span>
          </div>
          ${clientOwes > 0 ? `<div class="deal-nums" style="margin-top:2px"><span style="font-size:10px;color:var(--amber)">⏳ Должен: ${fmtUsd(clientOwes)}</span></div>` : ''}
        </div>`;
    });
  });

  html += '</div>';
  document.getElementById('deals').innerHTML = html;
}

async function settleDebt(debtId, encodedInitData) {
  if (!confirm('Отметить долг как оплаченный?')) return;
  try {
    const url = `${API_URL}?action=settle&debtId=${encodeURIComponent(debtId)}&initData=${encodedInitData}`;
    const res = await fetch(url);
    const j   = await res.json();
    if (j.ok) { await loadData(); }
    else alert('Ошибка: ' + (j.error || 'неизвестно'));
  } catch (e) { alert('Ошибка сети'); }
}

// ═══════════════════════════════════════════════════════
// ИСТОРИЯ ТРАНЗАКЦИЙ
// ═══════════════════════════════════════════════════════
const txById = new Map();
let historyFilter = 'all'; // all | biz | personal | in | out

function setHistoryFilter(f) {
  historyFilter = f;
  renderHistory();
}

function fmtDateLabel(dateStr) {
  const today = new Date().toISOString().substring(0, 10);
  const yest  = new Date(Date.now() - 86400000).toISOString().substring(0, 10);
  if (dateStr === today) return 'Сегодня';
  if (dateStr === yest)  return 'Вчера';
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  try { const d = new Date(dateStr + 'T12:00:00'); return d.getDate() + ' ' + months[d.getMonth()]; }
  catch { return dateStr; }
}

function renderHistory() {
  const allTxs = D.transactions || [];
  txById.clear();
  allTxs.forEach(tx => txById.set(tx.id, tx));

  // Фильтрация
  const txs = allTxs.filter(tx => {
    if (historyFilter === 'biz')      return tx.sphere !== 'Личное';
    if (historyFilter === 'personal') return tx.sphere === 'Личное';
    if (historyFilter === 'in')       return tx.direction === 'Приход';
    if (historyFilter === 'out')      return tx.direction === 'Расход';
    return true;
  });

  const f = historyFilter;
  const filterBar = `<div class="filter-row">
    <button class="filter-btn ${f==='all'?'active':''}"      onclick="setHistoryFilter('all')">Все</button>
    <button class="filter-btn ${f==='biz'?'active':''}"      onclick="setHistoryFilter('biz')">Бизнес</button>
    <button class="filter-btn ${f==='personal'?'active':''}" onclick="setHistoryFilter('personal')">👤 Личное</button>
    <button class="filter-btn ${f==='in'?'active':''}"       onclick="setHistoryFilter('in')">↗ Приход</button>
    <button class="filter-btn ${f==='out'?'active':''}"      onclick="setHistoryFilter('out')">↙ Расход</button>
  </div>`;

  if (!txs.length) {
    document.getElementById('history').innerHTML = filterBar + '<div class="center"><p class="c-hint">Нет транзакций</p></div>';
    return;
  }

  // Группировка по дате
  const byDate = {};
  txs.forEach(tx => {
    const d = String(tx.date || '').substring(0, 10);
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(tx);
  });

  let rows = '';
  Object.keys(byDate).sort().reverse().forEach(date => {
    const dayTxs = byDate[date];
    const dayNet = dayTxs.reduce((s, t) => s + (t.direction === 'Приход' ? (t.amtUsd||0) : -(t.amtUsd||0)), 0);
    const netCls = dayNet >= 0 ? 'c-green' : 'c-red';

    rows += `<div class="date-header">
      <span>${fmtDateLabel(date)}</span>
      <span class="date-day-total ${netCls}">${fmtSign(dayNet)}</span>
    </div>`;

    dayTxs.forEach(tx => {
      const isIn   = tx.direction === 'Приход';
      const amtCls = isIn ? 'c-green' : 'c-red';
      const icon   = isIn ? '↗' : '↙';
      const meta   = [tx.category, tx.counterparty].filter(Boolean).join(' · ');
      const sphereTag = tx.sphere === 'Личное' ? '<span style="font-size:10px;opacity:.6"> 👤</span>' : '';

      rows += `<div class="history-row">
        <div class="history-dir ${amtCls}">${icon}</div>
        <div class="history-main">
          <div class="history-amt ${amtCls}">${isIn?'+':'−'}${escHtml(String(tx.amount))} ${escHtml(tx.currency)}${sphereTag} <span style="font-size:11px;font-weight:400;color:var(--hint)">${fmtUsd(tx.amtUsd)}</span></div>
          ${meta          ? `<div class="history-meta">${escHtml(meta)}</div>` : ''}
          ${tx.description? `<div class="history-meta">${escHtml(tx.description)}</div>` : ''}
        </div>
        <div class="history-actions">
          <button class="icon-btn" onclick="openEditTx('${escHtml(tx.id)}')">✏️</button>
          <button class="icon-btn" onclick="deleteTx('${escHtml(tx.id)}')">🗑️</button>
        </div>
      </div>`;
    });
  });

  document.getElementById('history').innerHTML = filterBar + `<div>${rows}</div>`;
}

async function deleteTx(txId) {
  if (!confirm('Удалить транзакцию?')) return;
  try {
    const initData = tg ? tg.initData : '';
    const url = `${API_URL}?action=delete_tx&txId=${encodeURIComponent(txId)}&initData=${encodeURIComponent(initData)}`;
    const j = await (await fetch(url, { credentials: 'omit', redirect: 'follow' })).json();
    if (j.ok) { await loadData(); }
    else alert('Ошибка: ' + (j.error || 'неизвестно'));
  } catch (e) { alert('Ошибка сети'); }
}

// ─── Edit modal ───────────────────────────────────────────
let editingId = null;

function openEditTx(txId) {
  const tx = txById.get(txId);
  if (!tx) return;
  editingId = txId;
  document.getElementById('editAmount').value      = tx.amount;
  document.getElementById('editCurrency').value    = tx.currency;
  document.getElementById('editCategory').value    = tx.category || '';
  document.getElementById('editCounterparty').value = tx.counterparty || '';
  document.getElementById('editDescription').value = tx.description || '';
  setEditDir(tx.direction);
  document.getElementById('editModal').style.display = 'flex';
}

function closeEdit() {
  document.getElementById('editModal').style.display = 'none';
  editingId = null;
}

function setEditDir(dir) {
  document.getElementById('btnIn').className  = 'dir-btn' + (dir === 'Приход' ? ' active-in'  : '');
  document.getElementById('btnOut').className = 'dir-btn' + (dir === 'Расход' ? ' active-out' : '');
  document.getElementById('btnIn').dataset.active  = dir === 'Приход' ? '1' : '';
  document.getElementById('btnOut').dataset.active = dir === 'Расход' ? '1' : '';
}

function getEditDir() {
  return document.getElementById('btnIn').dataset.active ? 'Приход' : 'Расход';
}

async function saveEdit() {
  if (!editingId) return;
  try {
    const initData = tg ? tg.initData : '';
    const fields = {
      direction:    getEditDir(),
      amount:       parseFloat(document.getElementById('editAmount').value),
      currency:     document.getElementById('editCurrency').value.toUpperCase(),
      category:     document.getElementById('editCategory').value,
      counterparty: document.getElementById('editCounterparty').value,
      description:  document.getElementById('editDescription').value,
    };
    const url = `${API_URL}?action=edit_tx&txId=${encodeURIComponent(editingId)}&fields=${encodeURIComponent(JSON.stringify(fields))}&initData=${encodeURIComponent(initData)}`;
    const j = await (await fetch(url, { credentials: 'omit', redirect: 'follow' })).json();
    if (j.ok) { closeEdit(); await loadData(); }
    else alert('Ошибка: ' + (j.error || 'неизвестно'));
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function openDealDetail(dealId) {
  const deal = (D.deals || []).find(d => String(d.id) === String(dealId));
  if (!deal) return;
  const allTxs = (D.transactions || []).filter(t => String(t.dealId) === String(dealId));

  // ── Revenue (оплата клиента) ──────────────────────────
  const expected  = deal.expected  || 0;
  const received  = deal.received  || 0;
  const clientOwes = Math.max(0, expected - received);
  const recvPct   = expected > 0 ? Math.min(100, Math.round(received / expected * 100)) : 0;

  // ── Costs (затраты по сделке) ─────────────────────────
  // totalCost = плановые затраты = expected - profit
  const totalCost  = Math.max(0, expected - (deal.profit || 0));
  // paidCost = сумма расходов из привязанных транзакций
  const outTxs     = allTxs.filter(t => t.direction === 'Расход');
  const paidCost   = outTxs.reduce((s, t) => s + (t.amtUsd || 0), 0);
  const costLeft   = Math.max(0, totalCost - paidCost);
  const costPct    = totalCost > 0 ? Math.min(100, Math.round(paidCost / totalCost * 100)) : 0;

  // ── Profit ────────────────────────────────────────────
  const plannedProfit = deal.profit || 0;
  const actualSoFar   = received - paidCost; // сколько фактически «заработано» сейчас
  const profitCls     = plannedProfit >= 0 ? 'c-green' : 'c-red';
  const actualCls     = actualSoFar  >= 0 ? 'c-green' : 'c-red';

  // ── Status ────────────────────────────────────────────
  const shortStatus = String(deal.status || '').replace(/^\d+\.\s*/, '');

  // ── Transaction list ──────────────────────────────────
  let txHtml = '';
  if (!allTxs.length) {
    txHtml = `<div style="text-align:center;padding:14px 0;font-size:12px;color:var(--hint)">
      Транзакций по сделке нет.<br>
      <span style="opacity:.65;font-size:11px">Платежи привязываются автоматически, когда бот<br>сохраняет транзакцию с номером сделки.</span>
    </div>`;
  } else {
    // sort by date desc
    const sorted = [...allTxs].sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
    txHtml = sorted.map(t => {
      const isIn   = t.direction === 'Приход';
      const cls    = isIn ? 'c-green' : 'c-red';
      const sign   = isIn ? '+' : '−';
      const meta   = [t.category, t.counterparty].filter(Boolean).join(' · ');
      return `<div class="history-row">
        <div class="history-dir ${cls}" style="font-size:14px;min-width:14px">${sign}</div>
        <div class="history-main">
          <div style="font-size:13px;font-weight:600">${meta ? escHtml(meta) : escHtml(t.description||'Транзакция')}</div>
          <div class="c-hint" style="font-size:11px;margin-top:1px">${[t.description && meta ? escHtml(t.description) : '', escHtml((t.date||'').substring(0,10))].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="${cls}" style="font-weight:700;white-space:nowrap;text-align:right">
          <div>${sign}${escHtml(String(t.amount))} ${escHtml(t.currency)}</div>
          <div style="font-size:11px;opacity:.6">${fmtUsd(t.amtUsd)}</div>
        </div>
      </div>`;
    }).join('');
  }

  const html = `
    <div class="modal-overlay" onclick="closeDealDetail()">
      <div class="modal-box" onclick="event.stopPropagation()">

        <!-- Шапка -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
          <div>
            <div style="font-weight:700;font-size:17px">${escHtml(deal.client)}</div>
            <div class="c-hint" style="font-size:12px;margin-top:2px">${escHtml(deal.id)} · ${escHtml(shortStatus)}</div>
          </div>
          <button onclick="closeDealDetail()" class="icon-btn" style="font-size:18px;margin-top:-4px">✕</button>
        </div>
        <div style="font-size:11px;color:var(--hint);margin-bottom:14px">${escHtml(deal.type||'')}${deal.type&&deal.dateOpen?' · ':''}Открыта ${escHtml((deal.dateOpen||'').substring(0,10))}</div>

        <!-- Оплата клиента -->
        <div class="deal-section-label">💰 Оплата клиента</div>
        <div class="deal-section-block">
          <div class="deal-section-row">
            <span style="color:var(--hint)">Сумма договора</span>
            <span style="font-weight:700;font-size:15px;color:var(--amber)">${fmtUsd(expected)}</span>
          </div>
          <div class="progress-bar" style="margin:6px 0">
            <div class="progress-fill" style="width:${recvPct}%"></div>
          </div>
          <div class="deal-section-row">
            <span class="c-green">✓ Получено: <b>${fmtUsd(received)}</b></span>
            <span style="color:var(--hint)">Долг клиента: <b style="color:${clientOwes>0?'var(--amber)':'var(--green)'}">${fmtUsd(clientOwes)}</b></span>
          </div>
        </div>

        <!-- Затраты -->
        <div class="deal-section-label">📦 Затраты по сделке</div>
        <div class="deal-section-block">
          <div class="deal-section-row">
            <span style="color:var(--hint)">Плановые затраты</span>
            <span style="font-weight:700;font-size:15px;color:var(--red)">${fmtUsd(totalCost)}</span>
          </div>
          <div class="progress-bar progress-bar-red" style="margin:6px 0">
            <div class="progress-fill" style="width:${costPct}%"></div>
          </div>
          <div class="deal-section-row">
            <span style="color:var(--red)">↙ Оплачено: <b>${fmtUsd(paidCost)}</b></span>
            <span style="color:var(--hint)">Осталось: <b style="color:${costLeft>0?'var(--amber)':'var(--green)'}">${fmtUsd(costLeft)}</b></span>
          </div>
          ${allTxs.length===0&&totalCost>0?`<div style="font-size:10px;color:var(--hint);margin-top:6px;opacity:.7">* Считается по транзакциям с привязкой к сделке</div>`:''}
        </div>

        <!-- Прибыль -->
        <div class="deal-profit-block">
          <div class="deal-profit-col">
            <div class="lbl">Плановая прибыль</div>
            <div class="val ${profitCls}">${fmtSign(plannedProfit)}</div>
          </div>
          <div style="width:1px;height:36px;background:rgba(255,255,255,.1)"></div>
          <div class="deal-profit-col">
            <div class="lbl">Факт (получено − затраты)</div>
            <div class="val ${actualCls}">${fmtSign(actualSoFar)}</div>
          </div>
        </div>

        <!-- Транзакции -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--hint)">Транзакции (${allTxs.length})</div>
        </div>
        ${txHtml}
      </div>
    </div>`;

  document.getElementById('dealDetailContainer').innerHTML = html;
}

function closeDealDetail() {
  document.getElementById('dealDetailContainer').innerHTML = '';
}

// ═══════════════════════════════════════════════════════
// ГОЛОСОВОЙ ВВОД
// ═══════════════════════════════════════════════════════
let mediaRecorder = null;
let audioChunks   = [];

async function toggleMic() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  const btn = document.getElementById('micBtn');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks  = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      btn.classList.remove('recording');
      btn.textContent = '🎤';
      stream.getTracks().forEach(t => t.stop());
      showMicToast('⏳ Распознаю...');
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await sendVoice(blob);
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹';
    showMicToast('🔴 Запись... нажми ещё раз чтобы остановить');
  } catch (e) {
    showMicToast('❌ Нет доступа к микрофону: ' + e.message, 3000);
  }
}

async function sendVoice(blob) {
  try {
    const initData = tg ? tg.initData : '';
    const resp = await fetch('https://easyfin-bot.duckdns.org/transcribe?initData=' + encodeURIComponent(initData), {
      method: 'POST',
      headers: { 'Content-Type': 'audio/webm' },
      body: blob,
      credentials: 'omit',
    });
    const j = await resp.json();
    if (j.ok && j.text) {
      showMicToast('🎤 Отправлено боту:\n"' + j.text + '"', 5000);
    } else {
      showMicToast('❌ Не удалось распознать речь', 3000);
    }
  } catch (e) {
    showMicToast('❌ Ошибка: ' + e.message, 3000);
  }
}

function showMicToast(msg, duration) {
  const toast = document.getElementById('micToast');
  toast.textContent = msg;
  toast.style.display = 'block';
  if (duration) setTimeout(() => { toast.style.display = 'none'; }, duration);
}
